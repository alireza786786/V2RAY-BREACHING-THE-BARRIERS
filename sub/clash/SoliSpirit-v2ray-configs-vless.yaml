    - "tcp://1.1.1.1"
    - "tcp://8.8.8.8"
    - "1.1.1.1"
    - "8.8.8.8"
    - "9.9.9.9"
    - "tcp://1.0.0.1"
    - "tcp://8.8.4.4"
    - "tcp://9.9.9.9"
    - "tcp://149.112.112.112"
    - "tcp://208.67.222.222"
    - "tcp://208.67.220.220"
  nameserver:
    - "https://freedns.controld.com/p2#نوع انتخاب پروکسی 🔀"
  fallback:
    - "https://dns.adguard-dns.com/dns-query#نوع انتخاب پروکسی 🔀"
  fallback-lazy-query: true
  fallback-filter:
    geoip: false
    ipcidr:
